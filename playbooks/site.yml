---
- name: Apply core tools
  hosts: all
  tags: [core, workstation, server]
  roles:
    - _base
    - zsh
    - tmux
    - vim
    - neovim
    - lazygit
    - node
    - ai-tools
    - ollama
    - gh

- name: Apply workstation tools
  hosts: workstation
  tags: [workstation]
  roles:
    - tailscale
    - podman
    - zed
    - flatpak

- name: Apply server tools
  hosts: server
  tags: [server]
  roles:
    - _server
    - hermes
    - role: _control
      control_action: up
      control_app: hermes

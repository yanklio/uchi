---
dotfiles_source_dir: "{{ playbook_dir }}/.."
dotfiles_repo_dir: "{{ ansible_env.HOME }}/Dotfiles"
dotfiles_home_dir: "{{ dotfiles_source_dir }}/home"
homelab_dir: "{{ dotfiles_repo_dir }}/homelab"
homelab_env_file: "{{ homelab_dir }}/.env"

common_packages:
  - git
  - curl
  - ca-certificates
  - zsh
  - zsh-autosuggestions
  - zsh-syntax-highlighting
  - vim
  - neovim
  - tmux
  - fzf
  - ripgrep
  - nodejs
  - gcc
  - python3

common_fedora_packages:
  - golang
  - nodejs-npm

common_debian_packages:
  - python3-apt
  - npm
  - golang-go

workstation_packages:
  - htop
  - stow
  - podman
  - bat
  - fd-find
  - btop
  - gh
  - flatpak
  - xdg-utils
  - wl-clipboard
  - cava

workstation_fedora_packages:
  - git-delta
  - fastfetch
  - eza
  - vim-enhanced
  - zoxide
  - bash-completion
  - pgcli
  - conda
  - python3-pip
  - python3-isort
  - delve
  - gopls
  - black
  - ruff
  - google-noto-sans-fonts
  - google-noto-emoji-fonts

workstation_debian_packages:
  - fonts-noto
  - fonts-noto-color-emoji

flatpak_packages:
  - com.discord.Discord
  - com.slack.Slack
  - com.google.Chrome
  - app.zen_browser.zen

npm_packages:
  - "@anthropic-ai/claude-code"
  - opencode-ai
  - "@mariozechner/pi-coding-agent"
  - yarn

go_tools:
  - github.com/jesseduffield/lazygit@latest

upstream_tools:
  - command: zed
    name: Zed
    install_url: https://zed.dev/install.sh
  - command: ollama
    name: Ollama
    install_url: https://ollama.com/install.sh
  - command: tailscale
    name: Tailscale
    install_url: https://tailscale.com/install.sh

server_packages:
  - git
  - curl
  - ca-certificates
  - podman
  - nginx
  - python3

server_fedora_packages:
  - tailscale

server_debian_packages: []

homelab_access_mode: tailscale-only
homelab_app_bind: 127.0.0.1
homelab_apps: pi-hole,glance,open-webui
homelab_domain: home
homelab_tailnet_dns_suffix: gmk-de
homelab_tailnet_dns_names: glance,chat
homelab_enable_pihole_dns: false

pihole_password: change_me_to_a_strong_password
pihole_domain: home
dhcp_active: false
dhcp_start: 192.168.1.100
dhcp_end: 192.168.1.200
dhcp_router: 192.168.1.1
dhcp_lease_time: 24h

container_images:
  pihole: docker.io/pihole/pihole:2025.05.1
  glance: docker.io/glanceapp/glance:v0.8.4
  open_webui: ghcr.io/open-webui/open-webui:v0.6.26

homelab_app_files:
  - apps/pi-hole/docker-compose.yml
  - apps/glance/docker-compose.yml
  - apps/glance/glance.yml
  - apps/open-webui/docker-compose.yml
  - apps/open-webui/actions.py

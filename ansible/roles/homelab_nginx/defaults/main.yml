---
# Directory containing this repository's homelab tree.
homelab_dir: "{{ role_path }}/../../.."

# Optional .env file used to discover HOMELAB_ACCESS_MODE for local nginx runs.
homelab_env_file: "{{ homelab_dir }}/.env"

# Directory containing the source nginx conf.d files in this repository.
homelab_nginx_source_dir: "{{ homelab_dir }}/services/nginx/conf.d"

# Optional override for tests or hosts where `tailscale ip -4` is not available to Ansible.
homelab_tailscale_ipv4: ""

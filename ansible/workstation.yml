---
- name: Configure Workstation (Bootstrap)
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    dotfiles_dir: "{{ lookup('env', 'DOTFILES_DIR') | default(ansible_env.HOME + '/Dotfiles', true) }}"

  tasks:
    - name: Ensure base packages are installed (Debian/Ubuntu)
      ansible.builtin.apt:
        name:
          - git
          - zsh
          - vim
          - neovim
          - tmux
          - htop
          - curl
          - stow
          - podman
          - bat
          - eza
          - fzf
          - ripgrep
          - fd-find
          - btop
          - gh
        state: present
        update_cache: yes
      become: true
      when: ansible_os_family == "Debian"

    - name: Ensure base packages are installed (Fedora/RedHat)
      ansible.builtin.dnf:
        name:
          - git
          - zsh
          - vim
          - neovim
          - tmux
          - htop
          - curl
          - stow
          - podman
          - bat
          - eza
          - fzf
          - ripgrep
          - fd-find
          - btop
          - gh
        state: present
      become: true
      when: ansible_os_family == "RedHat"

    - name: Set up Go tools
      ansible.builtin.command: "go install {{ item }}"
      loop:
        - golang.org/x/tools/gopls@latest
        - github.com/go-delve/delve/cmd/dlv@latest
      ignore_errors: true

    - name: Ensure Oh My Zsh is installed
      ansible.builtin.shell: |
        if [ ! -d ~/.oh-my-zsh ]; then
          RUNZSH=no CHSH=no KEEP_ZSHRC=yes sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
        fi
      args:
        executable: /bin/bash

    - name: Enable system services
      ansible.builtin.systemd:
        name: podman.socket
        state: started
        enabled: yes
        scope: user
      ignore_errors: true

    - name: GNOME Settings
      ansible.builtin.command: "gsettings set org.gnome.desktop.wm.keybindings close \"['<Super>w']\""
      when: lookup('env', 'XDG_CURRENT_DESKTOP') == 'GNOME'
      ignore_errors: true

---
- name: Validate Proton Pass secret lookup variables
  ansible.builtin.assert:
    that:
      - proton_pass_item is defined
      - proton_pass_item | length > 0
      - proton_pass_vault is defined
      - proton_pass_vault | length > 0
      - proton_pass_field is defined
      - proton_pass_field | length > 0
      - proton_pass_cli_path | length > 0
    fail_msg: >-
      proton_pass_item, proton_pass_vault, and proton_pass_field must be set when
      including proton_pass/get_secret.yml.

- name: Check Proton Pass authentication
  ansible.builtin.command:
    argv:
      - "{{ proton_pass_cli_path }}"
      - test
  register: proton_pass_auth_test
  changed_when: false
  failed_when: false

- name: Require an authenticated Proton Pass session
  ansible.builtin.assert:
    that:
      - proton_pass_auth_test.rc == 0
    fail_msg: >-
      Proton Pass CLI is not authenticated for this user. Run `pass-cli login`,
      confirm with `pass-cli test`, and rerun the playbook.

- name: Read secret from Proton Pass
  ansible.builtin.command:
    argv:
      - "{{ proton_pass_cli_path }}"
      - item
      - view
      - --item-title
      - "{{ proton_pass_item }}"
      - --vault-name
      - "{{ proton_pass_vault }}"
      - --field
      - "{{ proton_pass_field }}"
  register: proton_pass_secret_result
  changed_when: false
  no_log: true

- name: Expose Proton Pass secret to the calling role
  ansible.builtin.set_fact:
    proton_pass_secret: "{{ proton_pass_secret_result.stdout | trim }}"
  no_log: true

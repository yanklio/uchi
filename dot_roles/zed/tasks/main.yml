---
- name: Setup zed
  block:
    - name: Check if zed is installed
      ansible.builtin.command:
        argv:
          - which
          - zed
      register: zed_check
      changed_when: false
      failed_when: false

    - name: Install zed
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL {{ zed_install_url }} | sh
      args:
        executable: /bin/bash
      when: zed_check.rc != 0

    - name: Create .config/zed directory
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/zed"
        state: directory
        mode: "0755"

    - name: Read WakaTime API key from Proton Pass
      ansible.builtin.include_role:
        name: proton_pass
        tasks_from: get_secret
      vars:
        proton_pass_item: "{{ zed_wakatime_pass_item }}"
        proton_pass_vault: "{{ zed_wakatime_pass_vault }}"
        proton_pass_field: "{{ zed_wakatime_pass_field }}"

    - name: Check for existing zed config
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/zed/settings.json"
      register: zed_settings

    - name: Create zed config
      ansible.builtin.template:
        src: settings.json.j2
        dest: "{{ ansible_facts['env']['HOME'] }}/.config/zed/settings.json"
        mode: "0600"
      vars:
        zed_wakatime_api_key: "{{ proton_pass_secret }}"
      when: not zed_settings.stat.exists
      no_log: true

    - name: Populate WakaTime API key in existing zed config
      ansible.builtin.replace:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/zed/settings.json"
        regexp: '^(\s*"api-key"\s*:\s*)"[^"]*"(\s*,?\s*)$'
        replace: '\1{{ proton_pass_secret | to_json }}\2'
        mode: "0600"
      when: zed_settings.stat.exists
      no_log: true

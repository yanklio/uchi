---
- name: Check homelab .env
  ansible.builtin.stat:
    path: "{{ homelab_env_file }}"
  register: homelab_env_stat

- name: Require homelab .env when needed
  ansible.builtin.assert:
    that:
      - homelab_env_stat.stat.exists
    fail_msg: >-
      Missing {{ homelab_env_file }}. Copy homelab/.env.example to homelab/.env
      and set PIHOLE_PASSWORD.
  when: homelab_env_required | bool

- name: Tighten homelab .env permissions
  ansible.builtin.file:
    path: "{{ homelab_env_file }}"
    mode: "0600"
  when:
    - homelab_env_stat.stat.exists
    - homelab_env_stat.stat.mode != '0600'
  changed_when: homelab_env_stat.stat.mode != '0600'

- name: Read homelab .env
  ansible.builtin.slurp:
    src: "{{ homelab_env_file }}"
  register: homelab_env_slurp
  when: homelab_env_stat.stat.exists

- name: Initialize homelab environment facts
  ansible.builtin.set_fact:
    homelab_env: {}

- name: Parse homelab .env values
  ansible.builtin.set_fact:
    homelab_env: >-
      {{ homelab_env | combine({
        (item | regex_replace('^\s*([^=]+?)\s*=.*$', '\1') | trim):
        (item | regex_replace('^\s*[^=]+?\s*=\s*(.*?)\s*$', '\1') | regex_replace('^([\"\''])(.*)\1$', '\2'))
      }) }}
  loop: "{{ (homelab_env_slurp.content | b64decode).splitlines() if homelab_env_stat.stat.exists else [] }}"
  when:
    - item | trim | length > 0
    - not (item | trim).startswith('#')
    - "'=' in item"
  no_log: true

- name: Derive homelab lifecycle settings
  ansible.builtin.set_fact:
    homelab_access_mode: "{{ homelab_env.HOMELAB_ACCESS_MODE | default('lan') }}"
    homelab_raw_apps: "{{ homelab_env.HOMELAB_APPS | default(homelab_default_apps) }}"
    homelab_rootless_apps: >-
      {{ (homelab_env.HOMELAB_APPS | default(homelab_default_apps) | regex_replace(',', ' ') | split)
         | reject('equalto', homelab_pihole_app) | list }}
    homelab_pihole_dns_enabled: >-
      {{ (homelab_env.HOMELAB_ENABLE_PIHOLE_DNS | default('false') | lower) in ['1', 'true', 'yes', 'on'] }}
    homelab_dhcp_active: >-
      {{ (homelab_env.DHCP_ACTIVE | default('true') | lower) in ['1', 'true', 'yes', 'on'] }}

- name: Derive Pi-hole startup mode
  ansible.builtin.set_fact:
    homelab_tailscale_only: "{{ homelab_access_mode == 'tailscale-only' }}"
    homelab_should_start_pihole: "{{ homelab_access_mode != 'tailscale-only' or homelab_pihole_dns_enabled }}"
    homelab_app_environment: >-
      {{ homelab_env | combine({'HOMELAB_APP_BIND': '127.0.0.1'} if homelab_access_mode == 'tailscale-only' else {}) }}

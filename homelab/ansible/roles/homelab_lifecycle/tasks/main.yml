---
- name: Validate requested homelab action
  ansible.builtin.assert:
    that:
      - homelab_action in homelab_valid_actions
    fail_msg: "Unknown homelab action: {{ homelab_action }}"

- name: Load homelab environment
  ansible.builtin.include_tasks: env.yml
  vars:
    homelab_env_required: "{{ homelab_action in ['start', 'restart', 'pihole'] }}"

- name: Validate homelab environment for startup
  ansible.builtin.include_tasks: validate.yml
  vars:
    homelab_validate_full: "{{ homelab_action in ['start', 'restart', 'pihole'] }}"
  when: homelab_action != 'status'

- name: Stop homelab stack for restart
  ansible.builtin.include_tasks: stop.yml
  when: homelab_action == 'restart'

- name: Start homelab stack
  ansible.builtin.include_tasks: start.yml
  when: homelab_action in ['start', 'restart']

- name: Stop homelab stack
  ansible.builtin.include_tasks: stop.yml
  when: homelab_action == 'stop'

- name: Start Pi-hole only
  ansible.builtin.include_tasks: pihole.yml
  when: homelab_action == 'pihole'

- name: Show homelab status
  ansible.builtin.include_tasks: status.yml
  when: homelab_action == 'status'

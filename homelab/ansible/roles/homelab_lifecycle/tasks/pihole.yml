---
- name: Validate podman compose availability
  ansible.builtin.include_tasks: podman.yml

- name: Require PIHOLE_PASSWORD
  ansible.builtin.assert:
    that:
      - homelab_env.PIHOLE_PASSWORD | default('') | length > 0
    fail_msg: "PIHOLE_PASSWORD must be set in {{ homelab_env_file }}"

- name: Check Pi-hole compose file
  ansible.builtin.stat:
    path: "{{ homelab_apps_dir }}/{{ homelab_pihole_app }}/docker-compose.yml"
  register: homelab_pihole_compose_stat

- name: Require Pi-hole compose file
  ansible.builtin.assert:
    that:
      - homelab_pihole_compose_stat.stat.exists
    fail_msg: "Missing {{ homelab_apps_dir }}/{{ homelab_pihole_app }}/docker-compose.yml"

- name: Remove legacy rootless Pi-hole container
  ansible.builtin.command:
    argv:
      - podman
      - rm
      - -f
      - pihole
  failed_when: false
  changed_when: false

- name: Detect hostname for tailnet DNS suffix fallback
  ansible.builtin.command: hostname
  register: homelab_hostname_result
  changed_when: false
  when:
    - homelab_tailscale_only
    - homelab_env.HOMELAB_TAILNET_DNS_SUFFIX is not defined

- name: Derive Pi-hole DNS inputs
  ansible.builtin.set_fact:
    homelab_pihole_dns_ip: "{{ homelab_tailscale_ipv4 | default('') if homelab_tailscale_only else homelab_env.HOMELAB_IP | default('') }}"
    homelab_pihole_dns_suffix: >-
      {{ homelab_env.HOMELAB_TAILNET_DNS_SUFFIX | default((homelab_hostname_result.stdout | default('') | split('.'))[0])
         if homelab_tailscale_only
         else homelab_env.HOMELAB_DOMAIN | default(homelab_env.PIHOLE_DOMAIN | default('home')) }}
    homelab_pihole_dns_names: >-
      {{ homelab_env.HOMELAB_TAILNET_DNS_NAMES | default(homelab_raw_apps)
         if homelab_tailscale_only
         else homelab_env.HOMELAB_DNS_NAMES | default('pihole,glance') }}

- name: Require IP for Pi-hole local DNS records
  ansible.builtin.assert:
    that:
      - homelab_pihole_dns_ip | length > 0
    fail_msg: "No IP available for Pi-hole local DNS records"

- name: Initialize Pi-hole DNS hosts
  ansible.builtin.set_fact:
    homelab_pihole_dns_hosts: []

- name: Build Pi-hole DNS host records
  ansible.builtin.set_fact:
    homelab_pihole_dns_hosts: "{{ homelab_pihole_dns_hosts + [homelab_pihole_dns_ip ~ ' ' ~ item ~ '.' ~ homelab_pihole_dns_suffix] }}"
  loop: "{{ homelab_pihole_dns_names | regex_replace(',', ' ') | split }}"

- name: Start rootful Pi-hole
  ansible.builtin.command:
    argv:
      - podman
      - compose
      - --env-file
      - "{{ homelab_env_file }}"
      - up
      - -d
    chdir: "{{ homelab_apps_dir }}/{{ homelab_pihole_app }}"
  become: true
  notify:
    - configure pihole dns
    - configure pihole dhcp

- name: Check systemd availability
  ansible.builtin.command: systemctl --version
  register: homelab_systemctl_version
  changed_when: false
  failed_when: false

- name: Queue podman restart service enablement when systemd is available
  ansible.builtin.debug:
    msg: "systemd is available; enabling podman-restart.service"
  changed_when: homelab_systemctl_version.rc == 0
  notify: enable podman restart service
  when: homelab_systemctl_version.rc == 0

- name: Run Pi-hole handlers now
  ansible.builtin.meta: flush_handlers

- name: Report Pi-hole startup complete
  ansible.builtin.debug:
    msg: "Pi-hole rootful container started."

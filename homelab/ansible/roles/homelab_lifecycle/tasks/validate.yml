---
- name: Validate rootless homelab app names
  ansible.builtin.assert:
    that:
      - "'/' not in item"
      - item not in ['.', '..']
    fail_msg: "Invalid app name in HOMELAB_APPS: {{ item }}"
  loop: "{{ homelab_rootless_apps }}"

- name: Check rootless homelab compose files
  ansible.builtin.stat:
    path: "{{ homelab_apps_dir }}/{{ item }}/docker-compose.yml"
  register: homelab_app_compose_stats
  loop: "{{ homelab_rootless_apps }}"

- name: Require known rootless homelab apps
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "Unknown homelab app: {{ item.item }}"
  loop: "{{ homelab_app_compose_stats.results }}"

- name: Validate HOMELAB_ACCESS_MODE
  ansible.builtin.assert:
    that:
      - homelab_access_mode in ['lan', 'tailscale-only']
    fail_msg: "Invalid HOMELAB_ACCESS_MODE: {{ homelab_access_mode }}"
  when: homelab_validate_full | bool

- name: Reject example Pi-hole password
  ansible.builtin.assert:
    that:
      - homelab_env.PIHOLE_PASSWORD | default('') != 'change_me_to_a_strong_password'
    fail_msg: "PIHOLE_PASSWORD still uses the example value"
  when: homelab_validate_full | bool

- name: Validate tailscale command exists in tailscale-only mode
  ansible.builtin.command: tailscale --version
  register: homelab_tailscale_command
  changed_when: false
  when:
    - homelab_validate_full | bool
    - homelab_tailscale_only

- name: Validate tailscale status in tailscale-only mode
  ansible.builtin.command: tailscale status
  register: homelab_tailscale_status
  changed_when: false
  when:
    - homelab_validate_full | bool
    - homelab_tailscale_only

- name: Detect tailscale IPv4 in tailscale-only mode
  ansible.builtin.command: tailscale ip -4
  register: homelab_tailscale_ipv4_result
  changed_when: false
  when:
    - homelab_validate_full | bool
    - homelab_tailscale_only

- name: Store tailscale IPv4
  ansible.builtin.set_fact:
    homelab_tailscale_ipv4: "{{ homelab_tailscale_ipv4_result.stdout_lines[0] | default('') }}"
  when:
    - homelab_validate_full | bool
    - homelab_tailscale_only

- name: Require tailscale IPv4 in tailscale-only mode
  ansible.builtin.assert:
    that:
      - homelab_tailscale_ipv4 | length > 0
    fail_msg: "No Tailscale IPv4 address found"
  when:
    - homelab_validate_full | bool
    - homelab_tailscale_only

---
- name: Validate podman compose availability
  ansible.builtin.include_tasks: podman.yml

- name: Start optional rootful Pi-hole
  ansible.builtin.include_tasks: pihole.yml
  when: homelab_should_start_pihole | bool

- name: Skip Pi-hole in tailscale-only mode
  ansible.builtin.debug:
    msg: "Skipping Pi-hole in tailscale-only mode."
  when: not (homelab_should_start_pihole | bool)

- name: Start rootless homelab apps
  ansible.builtin.command:
    argv: "{{ ['podman', 'compose'] + (['--env-file', homelab_env_file] if homelab_env_stat.stat.exists else []) + ['up', '-d'] }}"
    chdir: "{{ homelab_apps_dir }}/{{ item }}"
  environment: "{{ homelab_app_environment }}"
  loop: "{{ homelab_rootless_apps }}"

- name: Report homelab startup complete
  ansible.builtin.debug:
    msg: "All homelab containers started."

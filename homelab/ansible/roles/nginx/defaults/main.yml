---
# Directory containing the source nginx conf.d files in this repository.
homelab_nginx_source_dir: "{{ role_path }}/../../../services/nginx/conf.d"

# Match the Python homelab tooling default: LAN mode unless explicitly set.
homelab_access_mode: "{{ lookup('ansible.builtin.env', 'HOMELAB_ACCESS_MODE') | default('lan', true) }}"

# Optional override for tests or hosts where `tailscale ip -4` is not available to Ansible.
homelab_tailscale_ipv4: ""

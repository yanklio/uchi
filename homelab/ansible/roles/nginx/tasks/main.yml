---
- name: Validate homelab access mode
  ansible.builtin.assert:
    that:
      - homelab_access_mode in ['lan', 'tailscale-only']
    fail_msg: "Invalid HOMELAB_ACCESS_MODE: {{ homelab_access_mode }}"

- name: Discover source nginx configs
  ansible.builtin.find:
    paths: "{{ homelab_nginx_source_dir }}"
    patterns: "*.conf"
    file_type: file
  delegate_to: localhost
  become: false
  register: homelab_nginx_source_confs

- name: Require source nginx configs
  ansible.builtin.assert:
    that:
      - homelab_nginx_source_confs.matched | int > 0
    fail_msg: "Missing nginx config files in {{ homelab_nginx_source_dir }}"

- name: Discover Tailscale IPv4 address
  ansible.builtin.command: tailscale ip -4
  changed_when: false
  register: homelab_tailscale_ip_command
  when:
    - homelab_access_mode == 'tailscale-only'
    - homelab_tailscale_ipv4 | length == 0

- name: Select nginx listen address for LAN mode
  ansible.builtin.set_fact:
    homelab_nginx_listen: "80"
  when: homelab_access_mode == 'lan'

- name: Select nginx listen address for Tailscale-only mode
  ansible.builtin.set_fact:
    homelab_nginx_listen: "{{ (homelab_tailscale_ipv4 if homelab_tailscale_ipv4 | length > 0 else (homelab_tailscale_ip_command.stdout_lines | select | first)) }}:80"
  when: homelab_access_mode == 'tailscale-only'

- name: Require Tailscale listen address
  ansible.builtin.assert:
    that:
      - homelab_nginx_listen is match('^[^:]+:80$')
    fail_msg: "No Tailscale IPv4 address found; check 'tailscale status' and 'tailscale ip -4'."
  when: homelab_access_mode == 'tailscale-only'

- name: Ensure nginx conf.d exists
  ansible.builtin.file:
    path: /etc/nginx/conf.d
    state: directory
    mode: "0755"

- name: Inspect Debian default nginx site
  ansible.builtin.stat:
    path: /etc/nginx/sites-enabled/default
    follow: false
  register: homelab_nginx_default_site

- name: Remove symlinked Debian default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  when:
    - homelab_nginx_default_site.stat.exists
    - homelab_nginx_default_site.stat.islnk
  notify: nginx configuration changed

- name: Disable file-backed Debian default nginx site
  ansible.builtin.command: mv -n /etc/nginx/sites-enabled/default /etc/nginx/sites-available/default.disabled
  when:
    - homelab_nginx_default_site.stat.exists
    - not homelab_nginx_default_site.stat.islnk
  notify: nginx configuration changed

- name: Inspect packaged nginx default conf.d files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/nginx/conf.d/default.conf
    - /etc/nginx/conf.d/welcome.conf
  register: homelab_nginx_packaged_defaults

- name: Disable packaged nginx default conf.d files
  ansible.builtin.command: "mv -n {{ item.stat.path }} {{ item.stat.path }}.disabled"
  loop: "{{ homelab_nginx_packaged_defaults.results }}"
  when: item.stat.exists
  notify: nginx configuration changed

- name: Discover previously rendered dotfiles nginx configs
  ansible.builtin.find:
    paths: /etc/nginx/conf.d
    patterns: "dotfiles-*.conf"
    file_type: file
  register: homelab_nginx_previous_dotfiles

- name: Remove legacy and previously rendered nginx configs
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ ['/etc/nginx/conf.d/home-lab.conf'] + (homelab_nginx_previous_dotfiles.files | map(attribute='path') | list) }}"
  notify: nginx configuration changed

- name: Install rendered dotfiles nginx configs
  ansible.builtin.copy:
    dest: "/etc/nginx/conf.d/dotfiles-{{ item.path | basename }}"
    content: "{{ lookup('ansible.builtin.file', item.path) | replace('listen 80 default_server;', 'listen ' ~ homelab_nginx_listen ~ ' default_server;') | replace('listen 80;', 'listen ' ~ homelab_nginx_listen ~ ';') }}"
    mode: "0644"
  loop: "{{ homelab_nginx_source_confs.files | sort(attribute='path') }}"
  notify: nginx configuration changed

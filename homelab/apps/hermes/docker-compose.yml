services:
  hermes:
    image: ${HERMES_IMAGE:-docker.io/nousresearch/hermes-agent:latest}
    container_name: hermes
    command: gateway run
    ports:
      - "${HOMELAB_APP_BIND:-127.0.0.1}:8642:8642"
      - "${HOMELAB_APP_BIND:-127.0.0.1}:9119:9119"
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
    volumes:
      - ./data:/opt/data:z
    shm_size: 1g
    restart: unless-stopped

services:
  open-webui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.6.26}
    network_mode: host
    environment:
      HOST: ${HOMELAB_APP_BIND:-127.0.0.1}
      PORT: 3000
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      WEBUI_NAME: Homelab Chat
      ENABLE_RAG_WEB_LOADER_SSL_VERIFICATION: "False"
      RAG_EMBEDDING_ENGINE: ""
    volumes:
      - ./data:/app/backend/data:z
    restart: unless-stopped
